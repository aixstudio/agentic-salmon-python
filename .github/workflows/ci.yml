name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        env:
          LANGGRAPH_STRICT_MSGPACK: "true"
        run: python -m unittest discover -s tests -v
